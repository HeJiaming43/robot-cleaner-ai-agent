# 注意：chat_model_name 必须与账号实际可用的模型一致，
# 否则接口返回 404 Model not exist（当前环境实测 qwen3-max 不可用，需按账号改为 qwen-plus 等）
chat_model_name: qwen3-max

# 嵌入模型：1024 维。更换此值后【必须全量重建知识库】——
# 不同模型的向量不在同一语义空间，维度相同也不会报错，只会静默检索出不相干内容。
# 系统会在 chroma_db/index_manifest.json 记录建库所用模型，不一致时给出告警并拒绝增量导入。
embedding_model_name: qwen3.7-text-embedding-flash

# 模型调用失败重试次数（SDK 层）
max_retries: 2
# 流式输出期间允许的最大静默秒数，超时判定为模型无响应并给出可读错误
stall_timeout: 45
